<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esta es mi página</title>
<style>
 body{margin:0;min-height:100vh;background:#0f0f12;color:white;display:flex;justify-content:center;align-items:center;font-family:sans-serif;padding:20px}
 .card{max-width:400px;width:100%;background:#1c1c20;border-radius:28px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
 .card img{width:100%;height:380px;object-fit:cover}
 .info{padding:25px}
 h1{font-size:32px;margin-bottom:5px}
 .sub{color:#888;letter-spacing:3px;font-size:11px;margin-bottom:15px}
 .btn{display:inline-block;background:#ff2e7e;color:white;padding:12px 28px;border-radius:100px;text-decoration:none;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="card">
 <img src="mi_pagina_foto.jpg" alt="Mi foto">
 <div class="info">
   <h1>Esta es mi página</h1>
   <p class="sub">BIENVENIDO A MI MUNDO</p>
   <p>Gracias por visitar. Esta es mi página personal.</p>
   <a class="btn" href="#" onclick="alert('Gracias por visitar!');return false">Saludar 👋</a>
 </div>
</div>
</body>
</html>
